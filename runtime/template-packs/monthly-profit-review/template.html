<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="commerce-ui-contract" content="monthly-profit-review@1.0">
  <meta name="commerce-ui-version" content="__CLI_VERSION__">
  <title>__TITLE__</title>
  <style>
    :root{--blue:#315fd5;--blue-soft:#edf3ff;--ink:#18202d;--muted:#687386;--line:#e1e6ee;--paper:#f4f6f9;--card:#fff;--green:#087f5b;--red:#c92a2a;--amber:#a35d00;--sidebar:250px;--top:68px;--table-sticky-top:176px}*{box-sizing:border-box}html{scroll-behavior:smooth}body{margin:0;background:var(--paper);color:var(--ink);font:14px/1.55 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}.sidebar{position:fixed;inset:0 auto 0 0;width:var(--sidebar);background:#fbfcfe;border-right:1px solid var(--line);z-index:30;overflow:auto}.brand{height:var(--top);display:flex;align-items:center;gap:12px;padding:12px 16px;border-bottom:1px solid var(--line)}.mark{width:38px;height:38px;border-radius:11px;background:var(--blue);color:#fff;display:grid;place-items:center;font-size:18px;font-weight:800}.brand b,.brand small{display:block}.brand small{color:var(--muted)}.nav-label{padding:20px 16px 8px;color:#8893a5;font-size:12px;font-weight:700}.nav button{width:100%;border:0;background:transparent;color:#4d596b;text-align:left;padding:10px 16px;cursor:pointer;font:inherit}.nav button:hover{background:#f0f3f8}.nav button.active{background:var(--blue-soft);color:var(--blue);font-weight:700}.nav-group-title{padding:12px 16px 6px;color:#293448;font-weight:800}.nav-child{padding-left:30px!important;display:flex;justify-content:space-between;gap:8px}.nav-child span:last-child{font-variant-numeric:tabular-nums;color:#738097}.app{margin-left:var(--sidebar);min-height:100vh}.topbar{height:var(--top);position:sticky;top:0;z-index:25;background:rgba(255,255,255,.96);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:10px 24px}.identity b,.identity span{display:block}.identity b{font-size:17px}.identity span{color:var(--muted)}.date{border:1px solid var(--line);background:#fafbfc;border-radius:9px;padding:9px 12px;color:var(--muted)}main{max-width:1500px;margin:auto;padding:20px 24px 38px}.view[hidden]{display:none}.context-title{position:sticky;top:var(--top);z-index:20;background:var(--paper);padding:10px 0 14px;border-bottom:1px solid var(--line);margin-bottom:16px}.context-title h1{font-size:28px;line-height:1.25;margin:0}.context-title p{margin:5px 0 0;color:var(--muted)}.context-title .kicker{color:var(--blue);font-weight:800;font-size:12px;letter-spacing:.08em}.metrics{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px;margin-bottom:16px}.metric,.panel{background:var(--card);border:1px solid var(--line);border-radius:12px}.metric{padding:15px}.metric span,.metric small{display:block;color:var(--muted)}.metric b{display:block;font-size:23px;margin:4px 0;font-variant-numeric:tabular-nums}.positive{color:var(--green)!important}.negative{color:var(--red)!important}.warning{color:var(--amber)!important}.panel{margin-bottom:16px;overflow:hidden}.panel-head{padding:14px 16px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center;gap:12px}.panel-head h2{font-size:17px;margin:0}.panel-head span{color:var(--muted)}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:950px}th,td{padding:11px 12px;border-bottom:1px solid var(--line);text-align:left;white-space:nowrap}th{background:#f7f9fc;color:#5c687a;font-size:12px}.floating-table-head{position:fixed;display:none;z-index:24;overflow:hidden;background:#f7f9fc;box-shadow:0 1px 0 var(--line),0 5px 12px rgba(24,32,45,.12)}.floating-table-head table{margin:0}.floating-table-head th{background:#f7f9fc}td.num{text-align:right;font-variant-numeric:tabular-nums}.product-cell{display:flex;align-items:center;gap:10px;white-space:normal;min-width:310px}.thumb{width:48px;height:48px;border-radius:7px;object-fit:cover;background:#edf0f5;border:1px solid var(--line);flex:none}.thumb-placeholder{display:grid;place-items:center;color:#9aa3b2;font-size:12px}.product-name{font-weight:650;display:block}.product-id{color:var(--muted);font-size:12px;display:block;margin-top:2px}.table-tools{display:flex;align-items:center;gap:10px;flex-wrap:wrap;padding:12px 16px;background:#fafbfc;border-bottom:1px solid var(--line)}.table-search{min-width:300px;flex:1;padding:9px 11px;border:1px solid #ccd4df;border-radius:8px;background:#fff;font:inherit}.sort-button{border:0;background:transparent;color:inherit;font:inherit;font-weight:700;cursor:pointer;padding:0}.sort-button::after{content:" ↕";color:#a1a9b5}.sort-button[data-dir="asc"]::after{content:" ↑";color:var(--blue)}.sort-button[data-dir="desc"]::after{content:" ↓";color:var(--blue)}.pager{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px 16px}.pager button{border:1px solid #cfd7e3;background:#fff;border-radius:7px;padding:7px 12px;cursor:pointer}.pager button:disabled{opacity:.4;cursor:not-allowed}.pager-info{color:var(--muted)}.empty{padding:34px;text-align:center;color:var(--muted)}.notes{margin:0;padding:16px 36px}.notes li{margin:8px 0}.menu-toggle{display:none;border:1px solid var(--line);background:#fff;border-radius:8px;padding:7px 10px}.footer{color:var(--muted);text-align:center;padding:20px}.overlay{display:none}
    .payment-bridge table{min-width:0}.payment-bridge th,.payment-bridge td{white-space:normal}.payment-bridge td:last-child,.payment-bridge th:last-child{text-align:right;font-variant-numeric:tabular-nums}.payment-bridge .note{margin:0;padding:12px 16px;color:var(--muted);background:#fafbfc}
    @media(max-width:1000px){.metrics{grid-template-columns:repeat(2,1fr)}.sidebar{transform:translateX(-100%);transition:.2s}.sidebar.open{transform:none}.app{margin-left:0}.menu-toggle{display:block}.overlay.open{display:block;position:fixed;inset:0;background:rgba(0,0,0,.25);z-index:29}.topbar{padding:10px 14px}main{padding:14px}.context-title{top:var(--top)}}
    @media(max-width:600px){.metrics{grid-template-columns:1fr 1fr}.metric b{font-size:18px}.identity span,.date{display:none}.context-title h1{font-size:23px}.table-search{min-width:0;width:100%}}
    @media print{.sidebar,.topbar,.table-tools,.pager{display:none!important}.app{margin:0}.view,.view[hidden]{display:block!important;break-before:page}.context-title{position:static}.panel,.metric{break-inside:avoid}main{max-width:none;padding:0}}
  </style>
</head>
<body>
  <aside class="sidebar" id="sidebar"><div class="brand"><div class="mark">利</div><div><b>月度利润复盘</b><small>__SHOP_NAME__</small></div></div><div class="nav-label">分析视图</div><nav class="nav" id="nav">__NAV__</nav></aside>
  <div class="overlay" id="overlay"></div>
  <div class="app"><header class="topbar"><div style="display:flex;align-items:center;gap:10px"><button class="menu-toggle" id="menuToggle">☰</button><div class="identity"><b>__TITLE__</b><span>全店、负责人和商品利润复盘</span></div></div><div class="date">__DATE_RANGE__</div></header><main>__VIEWS__<div class="footer">__FOOTER__</div></main></div>
  <script type="application/json" id="reportData">__DATA__</script>
  <script>
  (()=>{
    const report=JSON.parse(document.getElementById('reportData').textContent),pageSize=50;
    const money=new Intl.NumberFormat('zh-CN',{style:'currency',currency:'CNY',minimumFractionDigits:2});
    const pct=v=>v==null?'—':`${(Number(v)*100).toFixed(2)}%`;
    const fmt={all_order_original_payment:money.format.bind(money),cancelled_order_original_payment:money.format.bind(money),gross_revenue:money.format.bind(money),refund_amount:money.format.bind(money),net_sales:money.format.bind(money),goods_cost:money.format.bind(money),freight_cost:money.format.bind(money),ad_spend:money.format.bind(money),post_refund_paid_ratio:pct,actual_profit:money.format.bind(money),profit_margin:pct};
    const columns=[['product','商品'],['owner','负责人'],['post_refund_paid_ratio','退款后付费占比'],['all_order_original_payment','全部订单原支付额'],['cancelled_order_original_payment','取消订单金额'],['gross_revenue','已发货销售原额'],['refund_amount','退款'],['net_sales','净销售额'],['goods_cost','商品成本'],['freight_cost','运费'],['ad_spend','推广费'],['actual_profit','实际利润'],['profit_margin','利润率']];
    function productCell(item){const image=item.image_url?`<img class="thumb" src="${escapeAttr(item.image_url)}" alt="${escapeAttr(item.name)}" loading="lazy" referrerpolicy="no-referrer">`:'<span class="thumb thumb-placeholder">暂无图</span>';return `<div class="product-cell">${image}<span><span class="product-name">${escapeHtml(item.name)}</span><span class="product-id">ID ${escapeHtml(item.id)}${item.cancelled_only?' · 无已发货销售':''}</span></span></div>`}
    function escapeHtml(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function escapeAttr(v){return escapeHtml(v)}
    const floatingControllers=[];
    function createFloatingHeader(root,head){const wrap=root.querySelector('.table-wrap'),table=wrap.querySelector('table'),holder=document.createElement('div');holder.className='floating-table-head';holder.innerHTML='<table><thead><tr></tr></thead></table>';document.body.appendChild(holder);const cloneHead=holder.querySelector('thead tr'),cloneTable=holder.querySelector('table');
      function update(){const view=root.closest('.view');if(view?.hidden){holder.style.display='none';return}const sourceRect=head.getBoundingClientRect(),tableRect=table.getBoundingClientRect(),wrapRect=wrap.getBoundingClientRect(),top=parseFloat(getComputedStyle(document.documentElement).getPropertyValue('--table-sticky-top'))||0,show=sourceRect.top<top&&tableRect.bottom>top+sourceRect.height;if(!show){holder.style.display='none';return}holder.style.display='block';holder.style.top=`${top}px`;holder.style.left=`${wrapRect.left}px`;holder.style.width=`${wrapRect.width}px`;holder.style.height=`${sourceRect.height}px`;cloneTable.style.width=`${tableRect.width}px`;cloneTable.style.transform=`translateX(${-wrap.scrollLeft}px)`}
      function sync(){cloneHead.innerHTML=head.innerHTML;const sourceCells=[...head.children],cloneCells=[...cloneHead.children];sourceCells.forEach((cell,index)=>{const width=cell.getBoundingClientRect().width;cloneCells[index].style.width=`${width}px`;cloneCells[index].style.minWidth=`${width}px`;cloneCells[index].style.maxWidth=`${width}px`});update()}
      holder.addEventListener('click',event=>{const button=event.target.closest('.sort-button');if(button)head.querySelector(`[data-key="${button.dataset.key}"]`)?.click()});wrap.addEventListener('scroll',update,{passive:true});return{sync,update}}
    function initTable(root){const key=root.dataset.source,base=key==='all'?report.products:key==='unowned'?report.unowned.products:report.owners.find(x=>x.id===key).products;let query='',sort='actual_profit',dir='asc',page=1,sticky;const head=root.querySelector('thead tr'),body=root.querySelector('tbody'),search=root.querySelector('.table-search'),info=root.querySelector('.pager-info'),prev=root.querySelector('.prev'),next=root.querySelector('.next');
      head.innerHTML=columns.map(([k,label])=>`<th><button class="sort-button" data-key="${k}">${label}</button></th>`).join('');
      function filtered(){let rows=base.filter(x=>!query||x.name.toLowerCase().includes(query)||x.id.toLowerCase().includes(query));rows=[...rows].sort((a,b)=>{let av=sort==='product'?`${a.name}\u0000${a.id}`:a[sort],bv=sort==='product'?`${b.name}\u0000${b.id}`:b[sort];if(av==null)return 1;if(bv==null)return -1;const value=typeof av==='number'?av-bv:String(av).localeCompare(String(bv),'zh-CN');return dir==='asc'?value:-value});return rows}
      function draw(){const rows=filtered(),pages=Math.max(1,Math.ceil(rows.length/pageSize));page=Math.min(page,pages);const visible=rows.slice((page-1)*pageSize,page*pageSize);body.innerHTML=visible.map(x=>`<tr><td>${productCell(x)}</td><td>${escapeHtml(x.owner)}</td>${columns.slice(2).map(([k])=>`<td class="num ${k==='actual_profit'?(x[k]>=0?'positive':'negative'):''}">${escapeHtml(fmt[k](x[k]))}</td>`).join('')}</tr>`).join('');if(!visible.length)body.innerHTML=`<tr><td colspan="${columns.length}" class="empty">没有匹配商品</td></tr>`;info.textContent=`共 ${rows.length} 个商品 · 第 ${page}/${pages} 页 · 每页 50 个`;prev.disabled=page<=1;next.disabled=page>=pages;root.querySelectorAll('.sort-button').forEach(b=>{b.dataset.dir=b.dataset.key===sort?dir:''});sticky?.sync()}
      search.addEventListener('input',()=>{query=search.value.trim().toLowerCase();page=1;draw()});head.addEventListener('click',e=>{const b=e.target.closest('.sort-button');if(!b)return;if(sort===b.dataset.key)dir=dir==='asc'?'desc':'asc';else{sort=b.dataset.key;dir=b.dataset.key==='product'||b.dataset.key==='owner'?'asc':'desc'}page=1;draw()});prev.addEventListener('click',()=>{page--;draw()});next.addEventListener('click',()=>{page++;draw()});draw();sticky=createFloatingHeader(root,head);floatingControllers.push(sticky);sticky.sync()}
    document.querySelectorAll('.product-table').forEach(initTable);
    const views=[...document.querySelectorAll('.view')],buttons=[...document.querySelectorAll('[data-view-target]')];function setStickyOffset(){const active=views.find(v=>!v.hidden),title=active?.querySelector('.context-title'),topbar=document.querySelector('.topbar');document.documentElement.style.setProperty('--table-sticky-top',`${(topbar?.offsetHeight||0)+(title?.offsetHeight||0)}px`);floatingControllers.forEach(controller=>controller.sync())}function show(id){views.forEach(v=>v.hidden=v.dataset.view!==id);buttons.forEach(b=>b.classList.toggle('active',b.dataset.viewTarget===id));location.hash=id;window.scrollTo({top:0});sidebar.classList.remove('open');overlay.classList.remove('open');requestAnimationFrame(setStickyOffset)};buttons.forEach(b=>b.addEventListener('click',()=>show(b.dataset.viewTarget)));const first=location.hash.slice(1);if(first&&views.some(v=>v.dataset.view===first))show(first);else setStickyOffset();window.addEventListener('scroll',()=>floatingControllers.forEach(controller=>controller.update()),{passive:true});window.addEventListener('resize',setStickyOffset);menuToggle.addEventListener('click',()=>{sidebar.classList.toggle('open');overlay.classList.toggle('open')});overlay.addEventListener('click',()=>{sidebar.classList.remove('open');overlay.classList.remove('open')});
  })();
  </script>
</body></html>
